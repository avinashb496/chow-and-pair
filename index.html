<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132340">
<title>The Chow &amp; Pair — Bookings</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html,body{height:100%}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme: light;
  --cream:#FBF7EC; --surface:#FFFDF7; --surface-2:#F5EFE0; --line:#E2D9C4; --line-soft:#EDE5D4;
  --ink:#132340; --ink-2:#31405C; --muted:#7C7362;
  --gold:#B8903F; --gold-soft:#E8D6AC;
  --jade:#1D7A5A; --jade-bg:#E2F1EA; --jade-line:#A8D4C2;
  --plum:#6B4B9C; --plum-bg:#EDE7F7; --plum-line:#C7B5E4;
  --red:#A32B36; --red-bg:#F8E7E5;
  --amber:#946118; --amber-bg:#FAEEDA;
  --nav-bg:#132340; --nav-ink:#E8DFC9; --nav-ink-dim:#93A2BC; --nav-active:#22375C;
  --shadow: 0 1px 2px rgba(19,35,64,.06), 0 8px 24px -12px rgba(19,35,64,.24);
  --shadow-lg: 0 24px 60px -20px rgba(19,35,64,.45);
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif; font-weight:600; margin:0; text-wrap:balance; letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- Boot ---------- */
#boot{min-height:100%;display:grid;place-items:center;padding:32px 16px;text-align:center;
  background:radial-gradient(1100px 560px at 50% -12%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%), var(--cream)}
#boot img{width:118px;height:118px;object-fit:cover;border-radius:14px;border:1px solid var(--line-soft)}
#boot h1{font-size:22px;margin-top:14px}
#boot p{color:var(--muted);font-size:12.5px;margin:5px 0 0;letter-spacing:.02em}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  transition:border-color .12s, box-shadow .12s}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;transition:.12s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-gold{background:var(--gold);color:#1A1204;border-color:var(--gold)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}

/* ---------- Shell ---------- */
#app{display:none;min-height:100%}
#app.on{display:grid;grid-template-columns:216px 1fr}
.rail{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;height:100dvh;padding:0 0 12px}
.rail-head{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.rail-head img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.rail-head .nm{font-family:"Playfair Display",Georgia,serif;font-size:15px;font-weight:600;line-height:1.15}
.rail-head .tg{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--nav-ink-dim);margin-top:2px}
.rail nav{display:flex;flex-direction:column;gap:2px;padding:6px 8px;flex:1}
.rail nav button{display:flex;align-items:center;gap:10px;padding:9px 11px;border:0;border-radius:8px;
  background:transparent;color:var(--nav-ink-dim);font-weight:500;font-size:13.5px;text-align:left;width:100%}
.rail nav button:hover{background:var(--nav-active);color:var(--nav-ink)}
.rail nav button.on{background:var(--nav-active);color:var(--nav-ink);font-weight:600;box-shadow:inset 2px 0 0 var(--gold)}
.rail nav button svg{width:17px;height:17px;flex:none;opacity:.9}
.rail-foot{padding:10px 14px 0;border-top:1px solid rgba(255,255,255,.1);margin:0 8px;font-size:11.5px;color:var(--nav-ink-dim)}
.rail-foot .who{color:var(--nav-ink);font-weight:600;font-size:12.5px}
.rail-foot button{margin-top:7px;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--nav-ink-dim);
  padding:5px 9px;border-radius:7px;font-size:11.5px}
.rail-foot button:hover{color:var(--nav-ink);border-color:rgba(255,255,255,.35)}

main{min-width:0;padding:22px 26px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:26px;line-height:1.1}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Schedule ---------- */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.datebar .nav-btn{width:31px;height:31px;display:grid;place-items:center;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.dlabel{font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;min-width:196px}
.dlabel span{font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:500;color:var(--muted);display:block;letter-spacing:.02em}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.grid{min-width:max-content}
.grow{display:flex;border-bottom:1px solid var(--line-soft)}
.grow:last-child{border-bottom:0}
.gcorner,.glabel{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);
  width:98px;min-width:98px;display:flex;flex-direction:column;justify-content:center;padding:0 11px}
.ghead{background:var(--surface-2);position:sticky;top:0;z-index:4}
.ghead .gcorner{background:var(--surface-2);z-index:5}
.gcorner{height:36px;justify-content:center}
.gcorner span{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gtimes{display:flex}
.gtime{width:66px;min-width:66px;height:36px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;color:var(--muted);border-left:1px solid var(--line-soft);
  font-family:"IBM Plex Mono",monospace}
.gtime.hr{color:var(--ink-2)}
.glabel{height:58px}
.glabel b{font-size:13px;font-weight:600}
.glabel small{font-size:10.5px;color:var(--muted)}
.gtrack{position:relative;display:flex;height:58px;flex:none}
.gcell{width:66px;min-width:66px;border-left:1px solid var(--line-soft);background:transparent;border-top:0;border-bottom:0;border-right:0;padding:0;transition:background .1s}
.gcell:hover{background:color-mix(in srgb,var(--gold) 13%,transparent)}
.gcell.off{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line-soft) 5px,var(--line-soft) 6px);cursor:not-allowed}
.blk{position:absolute;top:5px;border-radius:7px;padding:5px 8px;text-align:left;overflow:hidden;
  border:1px solid;display:flex;flex-direction:column;justify-content:center;gap:1px;z-index:2;box-shadow:var(--shadow)}
.blk .bn{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.blk .bm{font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:"IBM Plex Mono",monospace}
.blk.play{background:var(--jade-bg);border-color:var(--jade-line);color:var(--jade)}
.blk.learn{background:var(--plum-bg);border-color:var(--plum-line);color:var(--plum)}
.blk.unpaid{background-image:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.055) 6px,rgba(0,0,0,.055) 12px)}
.blk .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%}
.blk:hover{filter:brightness(1.04);transform:translateY(-1px)}
.blk.ghost{background:transparent;border:1px dashed var(--gold);color:var(--gold);box-shadow:none;
  align-items:center;justify-content:center}
.blk.ghost .bn{font-size:11px;font-weight:600;letter-spacing:.02em}
.blk.ghost:hover{background:color-mix(in srgb,var(--gold) 14%,transparent);transform:none}
.seatn{opacity:.7;font-weight:500}
.seatbar{display:inline-block;width:58px;height:6px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line-soft);margin-left:8px;vertical-align:middle;overflow:hidden}
.seatbar>span{display:block;height:100%;background:var(--gold);border-radius:999px}
.pill.seatpill{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid;margin-right:5px;vertical-align:-1px}

/* day list (mobile-friendly) */
.daylist{display:flex;flex-direction:column;gap:8px}
.dayrow{display:flex;gap:11px;align-items:stretch;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.dayrow .tm{min-width:62px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.5}
.dayrow .tm small{display:block;color:var(--muted);font-weight:400}
.dayrow .bd{flex:1;min-width:0}
.dayrow .bd b{font-size:14px;display:block}
.dayrow .bd .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.dayrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center;flex:none}
.stripe{width:3px;border-radius:2px;flex:none}
.stripe.play{background:var(--jade)} .stripe.learn{background:var(--plum)}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;
  font-weight:600;letter-spacing:.03em;border:1px solid;white-space:nowrap}
.pill.play{background:var(--jade-bg);border-color:var(--jade-line);color:var(--jade)}
.pill.learn{background:var(--plum-bg);border-color:var(--plum-line);color:var(--plum)}
.pill.paid{background:var(--jade-bg);border-color:var(--jade-line);color:var(--jade)}
.pill.part{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 35%,transparent);color:var(--amber)}
.pill.unpaid{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 30%,transparent);color:var(--red)}
.pill.refund{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.pill.ghost{background:var(--surface-2);border-color:var(--line);color:var(--muted)}

/* ---------- Kanban ---------- */
.kan{display:grid;grid-template-columns:repeat(5,minmax(216px,1fr));gap:11px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:9px;min-height:120px;transition:.12s}
.kcol.over{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 11%,var(--surface-2))}
.kcol h3{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-family:"IBM Plex Sans",sans-serif;display:flex;justify-content:space-between;margin-bottom:9px;padding:0 2px}
.kcol h3 em{font-style:normal;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--ink-2)}
.kcards{display:flex;flex-direction:column;gap:7px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;box-shadow:var(--shadow);
  cursor:grab;text-align:left;width:100%;display:block}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.4}
.kcard b{font-size:13px;display:block;line-height:1.3}
.kcard .meta{font-size:11px;color:var(--muted);margin-top:3px;font-family:"IBM Plex Mono",monospace}
.kcard .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.kmove{display:none;margin-top:7px;width:100%;font-size:11px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)}

/* ---------- Tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.dt{width:100%;border-collapse:collapse;min-width:720px}
table.dt th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:13px}
table.dt tr:last-child td{border-bottom:0}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover{background:var(--surface-2)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.filters .inp{width:auto;min-width:118px;padding:6px 10px;font-size:12.5px;border-radius:7px}

/* ---------- Dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(154px,1fr));gap:11px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:"Playfair Display",Georgia,serif;font-size:27px;font-weight:600;line-height:1.15;margin-top:5px;
  font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.stat.warn .v{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.panel h3{font-size:16px;margin-bottom:11px}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12.5px}
.bar .lab{min-width:72px;color:var(--muted)}
.bar .track{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line-soft)}
.bar .fill{height:100%;border-radius:999px}
.bar .num{min-width:30px;text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ul li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;
  padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
.ul li:last-child{border-bottom:0;padding-bottom:0}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,32,.55);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);
  width:100%;max-width:616px;margin:auto}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 13px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:19px}
.modal header .x{border:0;background:transparent;font-size:21px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.modal header .x:hover{background:var(--surface-2);color:var(--ink)}
.modal .body{padding:16px 20px}
.modal footer{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:13px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .right{display:flex;gap:8px;margin-left:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.sect{margin-top:15px;padding-top:14px;border-top:1px solid var(--line-soft)}
.sect:first-child{margin-top:0;padding-top:0;border-top:0}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.alert{border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:11px;border:1px solid}
.alert.bad{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 30%,transparent);color:var(--red)}
.alert.warn{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 32%,transparent);color:var(--amber)}
.alert b{font-weight:700}
.ckrow{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px}
.sugg{border:1px solid var(--line);border-radius:8px;margin-top:5px;max-height:172px;overflow-y:auto;background:var(--surface)}
.sugg button{display:block;width:100%;text-align:left;padding:7px 11px;border:0;background:transparent;border-bottom:1px solid var(--line-soft);font-size:13px}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--surface-2)}
.sugg .nm{font-weight:600}
.sugg .ph{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.chip.on.jade{background:var(--jade);border-color:var(--jade);color:#fff}
.chip.on.plum{background:var(--plum);border-color:var(--plum);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;
  z-index:90;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);text-align:center}

/* mobile bottom nav */
.tabbar{display:none}

@media (max-width:860px){
  #app.on{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:14px 16px calc(78px + env(safe-area-inset-bottom,0px))}
  .mobhead{display:flex;align-items:center;gap:9px;margin:-2px 0 12px}
  .mobhead img{width:33px;height:33px;border-radius:8px;object-fit:cover}
  .mobhead .nm{font-family:"Playfair Display",Georgia,serif;font-size:15px;font-weight:600}
  .mobhead .lo{margin-left:auto;font-size:11.5px;color:var(--muted);background:transparent;border:1px solid var(--line);padding:4px 9px;border-radius:7px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav-bg);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1)}
  .tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;
    background:transparent;color:var(--nav-ink-dim);font-size:9px;font-weight:600;padding:5px 1px;border-radius:8px;
    letter-spacing:0;overflow:hidden}
  .tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar button svg{width:18px;height:18px}
  .tabbar button.on{color:var(--gold)}
  .page-head h2{font-size:21px}
  .two{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr}
  .kan{grid-template-columns:repeat(5,minmax(230px,1fr))}
  .scrim{padding:0;align-items:stretch}
  .modal{max-width:none;border-radius:0;border:0;min-height:100%;display:flex;flex-direction:column;margin:0}
  .modal header{position:sticky;top:0;background:var(--surface);z-index:2;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .modal .body{flex:1}
  .modal footer{position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .modal footer .btn{flex:1}
  .kmove{display:block}
  .dlabel{min-width:0;font-size:16px}
  .stat .v{font-size:23px}
}
.mobhead{display:none}
@media (max-width:860px){ .mobhead{display:flex} }

/* ---------- Phone ----------
   Two things matter at this size: nothing needs a sideways swipe to reach,
   and everything can be hit with a thumb. Apple's floor for a tap target is
   44px; most of these controls were sitting at 28-33px. */
@media (max-width:860px){

  /* Boards stack instead of scrolling sideways. Dragging a card does not work
     on touch anyway, which is what the stage dropdown on each card is for. */
  .kan{grid-template-columns:1fr!important;gap:10px;overflow-x:visible}
  .kcol{min-height:0}
  .kcol h3{font-size:11.5px}
  .kcards{gap:8px}
  .kmove{display:block;min-height:42px;font-size:13px;padding:8px 10px}

  /* Thumb-sized controls */
  .btn{min-height:44px;padding:11px 16px;font-size:14px}
  .btn-sm{min-height:40px;padding:9px 13px;font-size:13px}
  .btn-block{min-height:48px}
  .inp{min-height:44px;font-size:16px}          /* 16px also stops iOS zooming on focus */
  textarea.inp{min-height:76px}
  .filters .inp{min-height:42px;font-size:14px;flex:1 1 44%;min-width:0}
  .filters{gap:8px}
  .seg{padding:3px}
  .seg button{min-height:40px;padding:9px 14px;font-size:13.5px}
  .datebar{gap:9px}
  .datebar .nav-btn{width:44px;height:44px;font-size:18px}
  .chip{min-height:42px;padding:10px 14px;font-size:13.5px}
  .x{min-width:44px;min-height:44px}
  table.dt tbody tr td{padding-top:12px;padding-bottom:12px}

  /* Nothing under about 11.5px */
  .pill{font-size:11px;padding:3px 9px}
  .hint{font-size:12px}
  .eyebrow{font-size:11px}
  .kcard b{font-size:14px}
  .kcard .meta{font-size:11.5px}
  .dayrow .bd .sub{font-size:12px}
  .dayrow .tm{font-size:12.5px}
  .stat .k{font-size:10.5px}
  .stat .s{font-size:12px}
  table.dt th{font-size:10.5px}
  table.dt td{font-size:13.5px}
  .legend{font-size:12px;gap:10px}
  .auth-card .creds{font-size:12px}

  /* The page subtitle can run long; let it breathe rather than crowd */
  .page-head p{font-size:13px;line-height:1.5}
  .hide-sm{display:none}
}

/* Coarse pointers on bigger screens (tablets at the desk) get the same
   generous targets without the phone layout changes. */
@media (pointer:coarse) and (min-width:861px){
  .btn{min-height:42px}
  .seg button{min-height:38px}
  .kmove{display:block;min-height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Auth ---------- */
#auth,#pending{min-height:100%;display:grid;place-items:center;padding:32px 16px;
  background:radial-gradient(1100px 560px at 50% -12%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%), var(--cream)}
.auth-card{width:100%;max-width:396px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:30px 26px 26px;box-shadow:var(--shadow);text-align:center}
.auth-card img{width:126px;height:126px;object-fit:cover;border-radius:14px;border:1px solid var(--line-soft);margin-bottom:14px}
.auth-card h1{font-size:23px}
.auth-sub{color:var(--muted);font-size:12.5px;margin:4px 0 20px;letter-spacing:.02em}
.auth-card .field{text-align:left}
.auth-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:600;font-size:12.5px;padding:0;text-decoration:underline}
.err{background:var(--red-bg);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);
  padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:12px;text-align:left}
.ok{background:var(--jade-bg);color:var(--jade);border:1px solid var(--jade-line);
  padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:12px;text-align:left}
.rail-foot .signout{margin-top:7px;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--nav-ink-dim);
  padding:5px 9px;border-radius:7px;font-size:11.5px}
.rail-foot .signout:hover{color:var(--nav-ink);border-color:rgba(255,255,255,.35)}
</style>
</head>
<body>

<div id="boot">
  <div>
    <img src="logo.jpg" alt="The Chow &amp; Pair">
    <h1>The Chow &amp; Pair</h1>
    <p>Connecting to the studio&hellip;</p>
  </div>
</div>

<div id="auth" hidden>
  <form class="auth-card" id="authForm">
    <img src="logo.jpg" alt="The Chow &amp; Pair">
    <h1>The Chow &amp; Pair</h1>
    <p class="auth-sub">Learn mahjong. Join the table.</p>
    <div id="authMsg" hidden></div>
    <div class="field" id="nameField" hidden>
      <label for="auName">Your name</label>
      <input class="inp" id="auName" autocomplete="name">
    </div>
    <div class="field">
      <label for="auEmail">Email</label>
      <input class="inp" id="auEmail" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="auPass">Password</label>
      <input class="inp" id="auPass" type="password" autocomplete="current-password" required minlength="8">
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="auGo" style="margin-top:6px">Sign in</button>
    <div class="auth-foot">
      <span id="auSwapText">First time here?</span>
      <button class="linkbtn" type="button" id="auSwap">Create an account</button>
    </div>
  </form>
</div>

<div id="pending" hidden>
  <div class="auth-card">
    <img src="logo.jpg" alt="">
    <h1>Almost there</h1>
    <p class="auth-sub" id="pendingWho">&nbsp;</p>
    <p style="font-size:13px;color:var(--ink-2);margin:0 0 18px">
      Your account exists but hasn't been switched on yet. Ask whoever runs the
      studio to activate you under Settings, then reload this page.
    </p>
    <button class="btn btn-block" type="button" id="pendReload">Check again</button>
    <button class="linkbtn" type="button" id="pendOut" style="margin-top:14px">Sign out</button>
  </div>
</div>

<div id="app">
  <aside class="rail">
    <div class="rail-head">
      <img src="logo.jpg" alt="">
      <div><div class="nm">Chow &amp; Pair</div><div class="tg">Academy &amp; Studio</div></div>
    </div>
    <nav id="railNav"></nav>
    <div class="rail-foot">
      <div class="who" id="whoName">&nbsp;</div>
      <div id="whoRole">&nbsp;</div>
      <button class="signout" id="signOut" type="button">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div class="tabbar" id="tabbar"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* Why app.js is loaded this way rather than with a plain <script src>.

   Static hosts cache JavaScript hard, and Safari hardest of all, so after
   an update the browser can keep running the old copy for hours. That has
   bitten this site twice: the site looks unchanged while the database has
   already moved on, which is confusing and looks like a bug.

   Asking for a slightly different URL every five minutes forces the
   browser to come back and check. The cost is one extra download of a
   100KB file at most once per page load, which is nothing. The benefit is
   that nobody ever has to clear a cache again. */
(function () {
  var s = document.createElement("script");
  s.src = "app.js?v=" + Math.floor(Date.now() / 300000);
  document.body.appendChild(s);
})();
</script>
</body>
</html>
